name: oidc-lab
on: workflow_dispatch
permissions:
 id-token: write
 contents: read
jobs:
 assume-role:
   runs-on: ubuntu-latest
   steps:
     - uses: aws-actions/configure-aws-credentials@v6
       with:
         role-to-assume: arn:aws:iam::006780474162:role/github-oidc-role
         aws-region: us-east-1
     - run: aws sts get-caller-identity
